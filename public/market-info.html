<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Market Info - PowerHouse</title>
<link rel="icon" href="/img/logo.png" type="image/png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><img class="brand-mark" src="/img/logo.png" alt="PowerHouse" /> PowerHouse</a>
      <div class="nav-right">
        <nav class="nav-menu">
          <a class="nav-link" href="/">익명게시판</a>
          <a class="nav-link active" href="/market-info.html">Market Info</a>
          <a class="nav-link" href="/lunch-map.html">식권대장</a>
        </nav>
        <span class="current-page-label" id="currentPageLabel"></span>
        <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기">☰</button>
      </div>
    </div>
  </div>

  <div class="container market-info-container">
    <div class="board-tabs market-info-tabs">
      <button class="board-tab active" data-sub="energy">에너지 솔루션</button>
      <button class="btn btn-primary btn-sm generate-now-btn" id="generateNowBtn" style="display:none;">⚡ 지금생성</button>
    </div>

    <div class="market-info-panel">
      <div class="market-info-head">
        <div>
          <div class="market-info-title">에너지 솔루션 브리핑</div>
          <div class="market-info-sub">SOFC·PAFC 연료전지, 반도체 전력, 발전사, 데이터센터 동향을 매일 아침 자동 수집합니다.</div>
        </div>
        <div class="market-info-updated" id="updatedAt">최종 업데이트 확인 중...</div>
      </div>
      <div id="briefingFeatured" class="briefing-featured"></div>

      <div class="briefing-index-title">지난 브리핑</div>
      <div class="board-table briefing-index-table">
        <div class="board-row board-head">
          <div class="col-title">생성일</div>
        </div>
        <div id="briefingIndexList"></div>
      </div>
      <div id="briefingIndexPagination" class="pagination"></div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/market-info.js"></script>
</body>
</html>
