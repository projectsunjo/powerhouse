<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 - PowerHouse</title>
<link rel="icon" href="/img/logo.png" type="image/png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="login-wrap card">
    <h1>🔐 로그인</h1>
    <p class="sub">웹마스터 · 마켓봇 지킴이 · 익명게시판 지킴이 · 임원/그룹장 전용</p>
    <div class="form-group">
      <input type="text" class="input" id="username" placeholder="아이디" autocomplete="username" />
    </div>
    <div class="form-group">
      <input type="password" class="input" id="password" placeholder="비밀번호" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary btn-block" id="loginBtn">로그인</button>
    <p class="sub" style="margin-top:16px;"><a href="/">← 익명게시판으로 돌아가기</a></p>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
