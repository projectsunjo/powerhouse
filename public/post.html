<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>게시글 - PowerHouse</title>
<link rel="icon" href="/img/logo.png" type="image/png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><img class="brand-mark" src="/img/logo.png" alt="PowerHouse" /> PowerHouse</a>
      <div class="nav-right">
        <nav class="nav-menu">
          <a class="nav-link active" href="/">익명게시판</a>
          <a class="nav-link" href="/market-info.html">Market Info</a>
          <a class="nav-link" href="/lunch-map.html">식권대장</a>
          <a class="nav-link" href="/usage-info.html">이용정보</a>
        </nav>
        <span class="current-page-label" id="currentPageLabel"></span>
        <span class="nav-profile" id="navProfile"></span>
        <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기">☰</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="editForm" class="card" style="padding:24px; display:none;">
      <h2 style="margin-top:0;">글 수정</h2>
      <div class="form-group">
        <label>제목</label>
        <input type="text" class="input" id="editTitle" maxlength="100" />
      </div>
      <div class="form-group">
        <label>내용</label>
        <textarea class="input" id="editContent" maxlength="10000"></textarea>
      </div>
      <div class="action-row">
        <button class="btn btn-ghost" id="editCancel">취소</button>
        <button class="btn btn-primary" id="editSave">저장</button>
      </div>
    </div>

    <div id="postView">
      <div class="card post-detail-card">
        <div class="post-detail-top">
          <div class="post-author">
            <div class="avatar">?</div>
            <div class="author-meta">
              <div class="nick" id="postNickname"></div>
              <div class="date" id="postDate"></div>
            </div>
          </div>
          <div class="post-menu-wrap">
            <button class="icon-btn" id="postMenuBtn">⋯</button>
            <div class="dropdown-menu" id="postMenu">
              <button id="reportPostBtn" class="report-hidden">🚩 신고</button>
              <button id="editPostBtn">✏️ 수정</button>
              <button id="deletePostBtn" class="danger">🗑 삭제</button>
            </div>
          </div>
        </div>

        <div id="postBadge"></div>
        <div class="post-detail-title" id="postTitle"></div>
        <div class="post-detail-body" id="postContent"></div>

        <div class="post-stats-row">
          <span class="stat-item">👁 <span id="postViews">0</span></span>
          <button class="stat-item likeable" id="likeBtn"><span class="heart-icon">♡</span> <span id="likeCount">0</span></button>
          <span class="stat-item">💬 <span id="commentStatCount">0</span></span>
        </div>
      </div>

      <div class="comments-section">
        <div class="comments-title">댓글 <span id="commentCount">0</span></div>
        <div class="card" id="commentList"></div>

        <div class="comment-form">
          <input type="text" class="input" id="commentQuick" placeholder="댓글을 입력하세요" />
          <div class="comment-form-expanded" id="commentExpanded" style="display:none;">
            <div class="comment-form-hint">익명 작성 시 개인정보는 저장되지 않습니다.</div>
            <textarea class="input" id="commentContent" maxlength="2000" style="min-height:70px" placeholder="댓글을 입력하세요"></textarea>
            <div class="comment-form-footer">
              <div class="comment-form-fields">
                <input type="text" class="input input-sm" id="commentNickname" maxlength="30" />
                <input type="password" class="input input-sm" id="commentPassword" maxlength="50" placeholder="비밀번호" />
              </div>
              <button class="btn btn-primary" id="commentSubmit">등록</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/post.js"></script>
</body>
</html>
