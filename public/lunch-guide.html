<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>식당도감 (점심 맛집 가이드) - PowerHouse</title>
<link rel="icon" href="/img/logo.png" type="image/png" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/lunch-guide.css" />
<link rel="stylesheet" href="/css/lunch-fun.css" />
</head>
<body class="lunch-guide-page">
  <!-- 상단 네비게이션 탑바 -->
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand-group">
        <a class="brand" href="/"><img class="brand-mark" src="/img/logo.png" alt="PowerHouse" /> PowerHouse</a>
        <span class="page-label-inline" id="pageLabelTop">식당도감</span>
      </div>
      <div class="nav-right">
        <nav class="nav-menu">
          <a class="nav-link" href="/">익명게시판</a>
          <a class="nav-link" href="/market-info.html">Market Info</a>
          <a class="nav-link active" href="/lunch-guide.html">식당도감</a>
          <a class="nav-link" href="/usage-info.html">이용정보</a>
        </nav>
        <span class="nav-profile" id="navProfile"></span>
        <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기"></button>
      </div>
    </div>
  </div>

  <!-- 메인 컨텐츠 영역 -->
  <main class="guide-main">
    <!-- 검색 및 필터 툴바 -->
    <div class="guide-toolbar">
      <!-- 1단: 식사 시간 필터 (아침/점심/저녁) -->
      <div class="guide-meal-tabs">
        <button class="guide-meal-btn active" data-meal="all">전체 식사 (66곳 전수등록)</button>
        <button class="guide-meal-btn" data-meal="breakfast">🌅 아침 (조식 전용 19곳)</button>
        <button class="guide-meal-btn" data-meal="lunch">☀️ 점심 (중식 전체 66곳)</button>
        <button class="guide-meal-btn" data-meal="dinner">🌙 저녁 (석식 55곳)</button>

        <!-- 점심 재미 도구 (Zero-API 프론트 전용) -->
        <div class="guide-fun-tools">
          <button class="fun-tool-btn fun-roulette" onclick="openRouletteModal()" title="현재 필터 조건 안에서 한 곳을 무작위로 뽑아 줍니다">🎡 오늘 뭐 먹지? 룰렛</button>
          <button class="fun-tool-btn fun-ladder" onclick="openLadderModal()" title="음료수·커피 내기 사다리 타기">🪜 음료 내기 사다리</button>
        </div>
      </div>

      <!-- 2단: 카테고리 칩 & 검색창 & 정렬 -->
      <div class="guide-toolbar-sub">
        <div class="guide-filters-left">
          <button class="guide-chip active" data-category="전체">전체메뉴</button>
          <button class="guide-chip" data-category="한식">🍚 한식</button>
          <button class="guide-chip" data-category="중식">🥟 중식</button>
          <button class="guide-chip" data-category="일식">🍱 일식</button>
          <button class="guide-chip" data-category="양식">🍔 양식</button>
          <button class="guide-chip" data-category="분식">🍙 분식</button>
          <button class="guide-chip" data-category="카페">☕ 카페</button>
        </div>

        <div class="guide-filters-right">
          <div class="guide-search-wrap">
            <span class="guide-search-icon">🔍</span>
            <input type="text" id="guideSearchInput" class="guide-search-input" placeholder="식당명, 메뉴, 위치 검색 (예: 서평옥, 김치찌개, 씨티스퀘어)" />
          </div>

          <select id="filterSortSelect" class="guide-select" title="정렬 기준">
            <option value="recommend">추천순</option>
            <option value="rating">평점 높은 순</option>
            <option value="review">리뷰 많은 순</option>
            <option value="name">가나다순</option>
          </select>
        </div>
      </div>

      <!-- 3단: 빌딩별 빠른 모아보기 바 -->
      <div class="guide-building-bar" id="buildingQuickBar">
        <span class="building-bar-label">🏢 주요 건물 모아보기:</span>
        <button class="building-quick-btn active" data-building="all" onclick="clearBuildingFilter()">전체보기 (66곳)</button>
        <button class="building-quick-btn" data-building="씨티스퀘어" onclick="selectBuildingQuick('씨티스퀘어')">씨티스퀘어 (8곳)</button>
        <button class="building-quick-btn" data-building="대한상공회의소" onclick="selectBuildingQuick('대한상공회의소')">대한상공회의소 (6곳)</button>
        <button class="building-quick-btn" data-building="퍼시픽타워" onclick="selectBuildingQuick('퍼시픽타워')">퍼시픽타워 (2곳)</button>
      </div>

      <!-- 4단: 테마 코스 필터 (국물·해장, 고기·구이, 면, 매운맛 등 음식 종류 기준 — JS 렌더링) -->
      <div class="guide-theme-bar" id="themeBar"></div>
    </div>

    <!-- 좌우 스플릿 뷰: 리스트 + 지도 -->
    <div class="guide-content-split">
      <!-- 좌측 식당 카드 리스트 -->
      <aside class="guide-sidebar">
        <!-- 건물 필터 활성화 알림 배너 -->
        <div id="buildingActiveBanner" class="building-active-banner" style="display: none;">
          <div class="banner-text">🏢 <strong id="buildingBannerTitle">씨티스퀘어</strong> 모아보는 중 (<span id="buildingBannerCount">0</span>곳)</div>
          <button class="banner-close-btn" onclick="clearBuildingFilter()" title="전체 식당 보기">전체보기 ✕</button>
        </div>

        <!-- 날씨 자동 추천 배너 (Open-Meteo, 비/더위/추위일 때만 JS 렌더링) -->
        <div id="weatherBanner" class="weather-banner" style="display: none;"></div>

        <div class="guide-list-header">
          <div class="guide-count-text">
            가맹점 <span id="restaurantCount" class="guide-count-badge">0</span>곳
            <span id="weatherChip" class="weather-chip" title="삼성본관 기준 현재 날씨 (Open-Meteo)"></span>
          </div>
          <div class="guide-header-right">
            <div class="guide-location-tag" id="activeFilterSummary">
              태평로 · 시청역 식당도감
            </div>
            <button class="link-copy-btn" onclick="copyFilterLink()" title="지금 보고 있는 필터 조건을 링크로 복사">🔗 링크 복사</button>
          </div>
        </div>

        <div id="restaurantList" style="display: flex; flex-direction: column; gap: 12px;">
          <!-- JS 렌더링 영역 -->
        </div>
      </aside>

      <!-- 우측 인터랙티브 지도 영역 -->
      <section class="guide-map-area">
        <div id="leafletMap"></div>
        <div class="map-floating-controls">
          <button class="map-control-btn" onclick="resetMapToHQ()" title="삼성본관 중심으로 이동">🏢 본관 중심</button>
          <button class="map-control-btn" onclick="fitAllPinsOnMap()" title="모든 식당 핀을 한눈에">🔍 핀 전체보기</button>
        </div>
      </section>
    </div>
  </main>

  <!-- 상세 정보 모달 다이얼로그 -->
  <div id="detailModalOverlay" class="modal-overlay">
    <div id="detailModalContent" class="guide-modal">
      <!-- JS 렌더링 영역 -->
    </div>
  </div>

  <!-- "오늘 뭐 먹지?" 룰렛 모달 -->
  <div id="rouletteModalOverlay" class="modal-overlay">
    <div class="guide-modal fun-modal">
      <div class="fun-modal-header fun-header-roulette">
        <div>
          <div class="fun-modal-title">🎡 오늘 뭐 먹지? 룰렛</div>
          <div class="fun-modal-sub" id="roulettePoolInfo">현재 필터 조건 안에서 한 곳을 뽑아 드립니다.</div>
        </div>
        <button class="fun-close-btn" onclick="closeRouletteModal()" aria-label="닫기">✕</button>
      </div>
      <div class="fun-modal-body roulette-layout">
        <div class="roulette-left">
          <div class="roulette-wheel-wrap">
            <div class="roulette-pointer"></div>
            <canvas id="rouletteCanvas" width="300" height="300"></canvas>
          </div>
          <button class="roulette-spin-btn" id="rouletteSpinBtn" onclick="spinRoulette()">🎲 돌리기!</button>
          <div class="roulette-hint" id="rouletteHint"></div>
        </div>
        <div class="roulette-right">
          <div class="roulette-section-title">🎯 테마 코스 (목록 필터와 연동)</div>
          <div class="roulette-theme-chips" id="rouletteThemeChips"></div>
          <div class="roulette-section-title">🍽️ 추첨 결과</div>
          <div id="rouletteResult" class="roulette-result">
            <div class="roulette-result-placeholder">
              <div style="font-size: 30px;">🤔</div>
              <div>돌리기 버튼을 누르면 오늘 점심이 정해집니다</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 음료 내기 사다리 타기 모달 -->
  <div id="ladderModalOverlay" class="modal-overlay">
    <div class="guide-modal fun-modal">
      <div class="fun-modal-header fun-header-ladder">
        <div>
          <div class="fun-modal-title">🪜 음료 내기 사다리 타기</div>
          <div class="fun-modal-sub" id="ladderContextNote">이름을 적고 위쪽 이름을 누르면 사다리를 타고 내려갑니다.</div>
        </div>
        <button class="fun-close-btn" onclick="closeLadderModal()" aria-label="닫기">✕</button>
      </div>
      <div class="fun-modal-body">
        <!-- 빠른 결정: 동전 던지기(참가자1 vs 2) · 주사위(참가자 중 1명) -->
        <div class="quick-decide">
          <span class="ladder-setting-label">⚡ 빠른 결정</span>
          <button type="button" class="ladder-action-btn" id="coinBtn" onclick="flipCoin()">🪙 동전 던지기</button>
          <button type="button" class="ladder-action-btn" id="diceBtn" onclick="rollDice()">🎲 주사위</button>
          <span id="quickDecideResult" class="quick-decide-result"></span>
        </div>

        <div class="ladder-settings">
          <div class="ladder-setting-group">
            <span class="ladder-setting-label">👥 인원</span>
            <div class="ladder-stepper">
              <button type="button" onclick="changeLadderCount(-1)" aria-label="인원 줄이기">−</button>
              <span id="ladderCountText">4</span>
              <button type="button" onclick="changeLadderCount(1)" aria-label="인원 늘리기">＋</button>
            </div>
          </div>
          <div class="ladder-setting-group">
            <span class="ladder-setting-label">🎁 내기 종류</span>
            <select id="ladderPresetSelect" class="guide-select" onchange="changeLadderPreset(this.value)"></select>
          </div>
          <div class="ladder-setting-group ladder-setting-actions">
            <button type="button" class="ladder-action-btn" onclick="regenerateLadder()">🔀 사다리 새로 섞기</button>
            <button type="button" class="ladder-action-btn ladder-action-primary" id="ladderRevealAllBtn" onclick="revealAllLadder()">▶ 전체 결과 보기</button>
          </div>
          <div id="ladderCustomResults" class="ladder-custom-results" style="display: none;"></div>
        </div>

        <div class="ladder-board">
          <div class="ladder-row" id="ladderNamesRow"></div>
          <canvas id="ladderCanvas"></canvas>
          <div class="ladder-row" id="ladderResultsRow"></div>
        </div>

        <div id="ladderSummary" class="ladder-summary" style="display: none;"></div>
      </div>
    </div>
  </div>

  <!-- 복사 완료 등 짧은 알림 토스트 -->
  <div id="funToast" class="fun-toast" role="status" aria-live="polite"></div>

  <!-- 스크립트 라이브러리 (오픈소스 Leaflet + 정적 데이터 + 앱 로직) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/lunch-data.js"></script>
  <script src="/js/lunch-guide.js"></script>
  <script src="/js/lunch-fun.js"></script>
</body>
</html>
