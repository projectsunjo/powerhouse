<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PowerHouse 익명게시판</title>
<link rel="icon" href="/img/logo.png" type="image/png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><img class="brand-mark" src="/img/logo.png" alt="PowerHouse" /> PowerHouse</a>
      <div class="nav-right">
        <nav class="nav-menu">
          <a class="nav-link active" href="/">익명게시판</a>
          <a class="nav-link" href="/market-info.html">Market Info</a>
          <a class="nav-link" href="/lunch-map.html">식권대장</a>
          <a class="nav-link" href="/usage-info.html">이용정보</a>
        </nav>
        <span class="current-page-label" id="currentPageLabel"></span>
        <span class="nav-profile" id="navProfile"></span>
        <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기">☰</button>
      </div>
    </div>
  </div>

  <div class="container board-container">
    <div class="board-tabs">
      <button class="board-tab active" data-sort="latest">최신순</button>
      <button class="board-tab" data-sort="best">Best글</button>
      <button class="board-tab" data-sort="suggestion">건의</button>
    </div>

    <div class="board-table">
      <div class="board-row board-head">
        <div class="col-title">제목</div>
      </div>
      <div id="postList"></div>
    </div>
    <div id="pagination" class="pagination"></div>

    <div class="toolbar-row">
      <div class="search-row">
        <input type="text" class="input" id="searchInput" placeholder="제목 또는 내용을 검색하세요" />
        <button class="btn btn-ghost" id="searchBtn">검색</button>
      </div>
      <a href="/write.html" id="writeLink"><button class="btn btn-primary">✏️ 글쓰기</button></a>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
