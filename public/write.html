<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>글쓰기 - PowerHouse</title>
<link rel="icon" href="/img/logo.png" type="image/png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="brand-group">
        <a class="brand" href="/"><img class="brand-mark" src="/img/logo.png" alt="PowerHouse" /> PowerHouse</a>
        <span class="page-label-inline" id="pageLabelTop"></span>
      </div>
      <div class="nav-right">
        <nav class="nav-menu">
          <a class="nav-link active" href="/">익명게시판</a>
          <a class="nav-link" href="/market-info.html">Market Info</a>
          <a class="nav-link" href="/lunch-map.html">식권대장</a>
          <a class="nav-link" href="/usage-info.html">이용정보</a>
        </nav>
        <span class="current-page-label" id="currentPageLabel"></span>
        <span class="nav-profile" id="navProfile"></span>
        <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기">☰</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card" style="padding: 24px;">
      <h2 style="margin-top:0; margin-bottom:4px;">✏️ 새 글 작성</h2>
      <p class="small-muted" style="margin-top:0;">맹목적인 비난이나 부적절한 글은 예고없이 삭제 될 수 있습니다.</p>

      <div class="board-tabs" id="writeCategoryTabs" style="margin-bottom:16px;">
        <button class="board-tab active" data-category="general">일반글</button>
        <button class="board-tab" data-category="suggestion">건의글</button>
      </div>

      <div class="form-row" id="suggestionFields" style="display:none;">
        <div class="form-group">
          <label>건의 대상</label>
          <div class="target-picker" id="targetPicker">
            <button type="button" class="target-picker-btn" id="targetPickerBtn">
              <img id="targetPickerAvatar" class="avatar-thumb" src="/img/logo.png" />
              <span id="targetPickerLabel">일반건의</span>
              <span class="target-picker-chevron">▾</span>
            </button>
            <div class="target-picker-menu" id="targetPickerMenu"></div>
          </div>
          <input type="hidden" id="targetUserId" value="" />
        </div>
        <div class="form-group" id="isPrivateField" style="flex:0 0 auto; align-items:flex-end; padding-bottom:12px; display:none;">
          <label class="checkbox-row" style="display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="isPrivate" /> 비밀글로 작성
          </label>
        </div>
      </div>

      <div class="form-row" id="anonFields">
        <div class="form-group">
          <div style="display:flex; align-items:center; gap:8px;">
            <img id="nicknameAvatar" class="avatar-thumb" style="display:none;" />
            <input type="text" class="input input-dimmed" id="nickname" maxlength="30" style="flex:1;" />
          </div>
        </div>
        <div class="form-group" id="passwordField">
          <input type="password" class="input" id="password" maxlength="50" placeholder="비밀번호 (수정/삭제 시 필요, 4자 이상)" />
        </div>
      </div>

      <div class="form-group">
        <input type="text" class="input" id="title" maxlength="100" placeholder="제목을 입력하세요" />
      </div>

      <div class="form-group">
        <textarea class="input" id="content" maxlength="10000" placeholder="내용을 입력하세요"></textarea>
      </div>

      <div class="action-row">
        <a href="/"><button class="btn btn-ghost">취소</button></a>
        <button class="btn btn-primary" id="submitBtn">등록하기</button>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/write.js"></script>
</body>
</html>
