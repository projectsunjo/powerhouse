<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>글쓰기 - PowerHouse</title>
<link rel="icon" href="/img/logo.png" type="image/png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><img class="brand-mark" src="/img/logo.png" alt="PowerHouse" /> PowerHouse</a>
      <div class="nav-right">
        <nav class="nav-menu">
          <a class="nav-link active" href="/">익명게시판</a>
          <a class="nav-link" href="/market-info.html">Market Info</a>
          <a class="nav-link" href="/lunch-map.html">식권대장</a>
          <a class="nav-link" href="/usage-info.html">이용정보</a>
        </nav>
        <span class="current-page-label" id="currentPageLabel"></span>
        <span class="nav-profile" id="navProfile"></span>
        <button class="nav-toggle" id="navToggle" aria-label="메뉴 열기">☰</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card" style="padding: 24px;">
      <h2 style="margin-top:0;">✏️ 새 글 작성</h2>

      <div class="board-tabs" id="writeCategoryTabs" style="margin-bottom:16px;">
        <button class="board-tab active" data-category="general">일반글</button>
        <button class="board-tab" data-category="suggestion">건의글</button>
      </div>

      <div class="form-row" id="suggestionFields" style="display:none;">
        <div class="form-group">
          <label>건의 대상 (@)</label>
          <select class="input" id="targetUserId"></select>
        </div>
        <div class="form-group" style="flex:0 0 auto; display:flex; align-items:flex-end; padding-bottom:12px;">
          <label class="checkbox-row" style="display:flex; align-items:center; gap:6px;">
            <input type="checkbox" id="isPrivate" /> 비밀글로 작성
          </label>
        </div>
      </div>

      <div class="form-row" id="anonFields">
        <div class="form-group">
          <input type="text" class="input input-dimmed" id="nickname" maxlength="30" />
        </div>
        <div class="form-group">
          <input type="password" class="input" id="password" maxlength="50" placeholder="비밀번호 (수정/삭제 시 필요, 4자 이상)" />
        </div>
      </div>

      <div class="form-group">
        <input type="text" class="input" id="title" maxlength="100" placeholder="제목을 입력하세요" />
      </div>

      <div class="form-group">
        <textarea class="input" id="content" maxlength="10000" placeholder="내용을 입력하세요"></textarea>
      </div>

      <div class="action-row">
        <a href="/"><button class="btn btn-ghost">취소</button></a>
        <button class="btn btn-primary" id="submitBtn">등록하기</button>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/write.js"></script>
</body>
</html>
