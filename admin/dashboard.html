<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>관리자 대시보드 - PowerHouse</title>
<link rel="icon" href="/img/logo.png" type="image/png" />
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/"><img class="brand-mark" src="/img/logo.png" alt="PowerHouse" /> PowerHouse Admin</a>
      <div style="display:flex; gap:8px;">
        <a href="/" target="_blank"><button class="btn btn-ghost btn-sm">사이트 보기</button></a>
        <button class="btn btn-ghost btn-sm" id="logoutBtn">로그아웃</button>
      </div>
    </div>
  </div>

  <div class="admin-container">
    <div class="stat-grid">
      <div class="card stat-card"><div class="num" id="statPosts">-</div><div class="label">전체 게시글</div></div>
      <div class="card stat-card"><div class="num" id="statComments">-</div><div class="label">전체 댓글</div></div>
      <div class="card stat-card"><div class="num" id="statToday">-</div><div class="label">오늘 작성글</div></div>
      <div class="card stat-card"><div class="num" id="statReports">-</div><div class="label">대기중인 신고</div></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="posts">게시글 관리</button>
      <button class="tab-btn" data-tab="comments">댓글 관리</button>
      <button class="tab-btn" data-tab="reports">신고 관리</button>
      <button class="tab-btn" data-tab="words">금지어 관리</button>
      <button class="tab-btn" data-tab="suggestions">건의글 관리</button>
      <button class="tab-btn" data-tab="briefings">마켓봇 관리</button>
      <button class="tab-btn" data-tab="users">회원관리</button>
    </div>

    <div class="tab-panel active" id="tab-posts">
      <div class="search-row">
        <input type="text" class="input" id="postSearch" placeholder="제목/내용 검색" />
        <button class="btn btn-ghost" id="postSearchBtn">검색</button>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>ID</th><th>제목</th><th>닉네임</th><th>조회</th><th>추천</th><th>상태</th><th>작성일</th><th>관리</th></tr></thead>
          <tbody id="postsTbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="postsPagination"></div>
    </div>

    <div class="tab-panel" id="tab-comments">
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>ID</th><th>글번호</th><th>내용</th><th>닉네임</th><th>작성일</th><th>관리</th></tr></thead>
          <tbody id="commentsTbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="commentsPagination"></div>
    </div>

    <div class="tab-panel" id="tab-reports">
      <div class="search-row">
        <select class="input" id="reportStatus" style="max-width:200px;">
          <option value="pending">대기중</option>
          <option value="resolved">처리완료</option>
        </select>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>ID</th><th>유형</th><th>대상 ID</th><th>사유</th><th>신고일</th><th>관리</th></tr></thead>
          <tbody id="reportsTbody"></tbody>
        </table>
      </div>
    </div>

    <div class="tab-panel" id="tab-words">
      <div class="search-row">
        <input type="text" class="input" id="newWord" placeholder="금지어 추가" />
        <button class="btn btn-primary" id="addWordBtn">추가</button>
      </div>
      <div class="banned-word-list" id="wordList"></div>
    </div>

    <div class="tab-panel" id="tab-suggestions">
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>ID</th><th>제목</th><th>대상</th><th>상태</th><th>작성일</th><th>관리</th></tr></thead>
          <tbody id="suggestionsTbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="suggestionsPagination"></div>
    </div>

    <div class="tab-panel" id="tab-briefings">
      <div class="card" id="heartbeatCard" style="padding:14px 18px; margin-bottom:16px;">
        <div id="heartbeatStatus" class="small-muted">자동 생성 상태 확인 중...</div>
      </div>

      <div class="card briefing-settings-card">
        <div class="form-row">
          <div class="form-group" style="flex:0 0 auto;">
            <label>자동 생성</label>
            <label class="checkbox-row"><input type="checkbox" id="scheduleEnabled" /> 사용</label>
          </div>
          <div class="form-group" style="flex:0 0 140px;">
            <label>시작 시각 (한국시간)</label>
            <select class="input" id="scheduleHour"></select>
          </div>
          <div class="form-group" style="flex:0 0 160px;">
            <label>생성 주기</label>
            <select class="input" id="intervalHours">
              <option value="6">6시간마다</option>
              <option value="8">8시간마다</option>
              <option value="12">12시간마다</option>
              <option value="24">24시간마다 (매일)</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>수신 이메일 (여러 개는 ; 로 구분)</label>
          <input type="text" class="input" id="emailRecipients" placeholder="a@example.com; b@example.com" />
        </div>
        <div class="form-group">
          <label>메일 제목 양식 ({날짜}는 생성일로 치환됩니다)</label>
          <input type="text" class="input" id="emailSubjectTemplate" placeholder="[ESMI 마켓봇] 국내외 전력 및 SOFC 관련 {날짜}" />
        </div>
        <div class="action-row" style="justify-content:flex-start;">
          <button class="btn btn-primary" id="settingsSaveBtn">설정 저장</button>
        </div>
      </div>

      <div class="search-row">
        <button class="btn btn-primary" id="briefingGenerateBtn">⚡ 지금생성</button>
        <button class="btn btn-ghost" id="briefingSendEmailBtn">✉️ 이메일 발송</button>
        <span class="small-muted" id="briefingStatus"></span>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>ID</th><th>생성일</th><th>유형</th><th>상태</th><th>이메일</th><th>관리</th></tr></thead>
          <tbody id="briefingRunsTbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="briefingRunsPagination"></div>
      <div id="briefingEditWrap" style="display:none; margin-top:16px;">
        <div class="form-group">
          <label>HTML 내용 수정</label>
          <textarea class="input" id="briefingEditArea" style="min-height:320px; font-family:monospace; font-size:0.8rem;"></textarea>
        </div>
        <div class="action-row">
          <button class="btn btn-ghost" id="briefingEditCancel">취소</button>
          <button class="btn btn-primary" id="briefingEditSave">저장</button>
        </div>
      </div>

      <div class="briefing-index-title" style="margin-top:28px;">이메일 발송 로그</div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>발송일시</th><th>레포트ID</th><th>유형</th><th>발신</th><th>수신</th><th>상태</th></tr></thead>
          <tbody id="emailLogsTbody"></tbody>
        </table>
      </div>
      <div class="pagination" id="emailLogsPagination"></div>
    </div>

    <div class="tab-panel" id="tab-users">
      <div class="card" style="padding:20px; margin-bottom:20px;">
        <div class="form-row">
          <div class="form-group">
            <label>아이디</label>
            <input type="text" class="input" id="newUserUsername" placeholder="아이디" />
          </div>
          <div class="form-group">
            <label>초기 비밀번호</label>
            <input type="text" class="input" id="newUserPassword" placeholder="4자 이상" />
          </div>
          <div class="form-group">
            <label>표시 이름</label>
            <input type="text" class="input" id="newUserDisplayName" placeholder="예: 김상무" />
          </div>
          <div class="form-group">
            <label>권한</label>
            <select class="input" id="newUserRole">
              <option value="marketbot_keeper">마켓봇 지킴이</option>
              <option value="board_keeper">익명게시판 지킴이</option>
              <option value="executive">임원 및 그룹장</option>
              <option value="webmaster">웹마스터</option>
            </select>
          </div>
        </div>
        <div class="action-row" style="justify-content:flex-start;">
          <button class="btn btn-primary" id="addUserBtn">계정 추가</button>
        </div>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>ID</th><th>사진</th><th>아이디</th><th>표시 이름</th><th>권한</th><th>프로필 노출</th><th>게시판순서</th><th>생성일</th><th>관리</th></tr></thead>
          <tbody id="usersTbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/admin/js/dashboard.js"></script>
</body>
</html>
