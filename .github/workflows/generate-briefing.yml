name: generate-briefing

on:
  schedule:
    # Runs every hour; scripts/generate-briefing.js decides whether it's
    # actually time to generate based on the admin-configured schedule
    # (unless triggered manually below, which always forces a run).
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Generate immediately regardless of schedule'
        required: false
        default: 'true'
      run_id:
        description: 'Existing briefing_runs id to report back to (set by the 지금생성 button)'
        required: false
        default: ''

jobs:
  generate:
    runs-on: self-hosted
    timeout-minutes: 30
    env:
      https_proxy: http://90.8.10.30:9090
      http_proxy: http://90.8.10.30:9090
      NODE_EXTRA_CA_CERTS: /home/sunjohwang/corp-ca-bundle.pem
      SSL_CERT_FILE: /home/sunjohwang/corp-ca-bundle.pem
      npm_config_cafile: /home/sunjohwang/corp-ca-bundle.pem
      GIT_SSL_CAINFO: /home/sunjohwang/corp-ca-bundle.pem
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate briefing
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: node scripts/generate-briefing.js
