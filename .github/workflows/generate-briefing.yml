name: generate-briefing

on:
  schedule:
    # Runs every hour, with targeted slots for 08:00 KST (23:00 UTC);
    # scripts/generate-briefing.js decides whether it's actually time to generate
    # based on the admin-configured schedule (unless triggered manually).
    - cron: '0 23 * * *'
    - cron: '15 23 * * *'
    - cron: '30 23 * * *'
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Generate immediately regardless of schedule'
        required: false
        default: 'true'
      run_id:
        description: 'Existing briefing_runs id to report back to (set by the 지금생성 button)'
        required: false
        default: ''
      set_github_token:
        description: 'Optional GitHub PAT to store in DB settings'
        required: false
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --omit=dev

      - name: Generate briefing
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          SET_GITHUB_TOKEN: ${{ github.event.inputs.set_github_token }}
        run: node scripts/generate-briefing.js
