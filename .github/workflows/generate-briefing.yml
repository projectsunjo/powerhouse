name: generate-briefing

on:
  schedule:
    # Runs every hour, with targeted slots for 08:00 KST (23:00 UTC);
    # scripts/generate-briefing.js decides whether it's actually time to generate
    # based on the admin-configured schedule (unless triggered manually).
    - cron: '0 23 * * *'
    - cron: '15 23 * * *'
    - cron: '30 23 * * *'
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Generate immediately regardless of schedule'
        required: false
        default: 'true'
      run_id:
        description: 'Existing briefing_runs id to report back to (set by the 지금생성 button)'
        required: false
        default: ''
      set_github_token:
        description: 'Optional GitHub PAT to store in DB settings'
        required: false
        default: ''
      skip_email:
        description: 'Generate and record the briefing without emailing it (for test runs)'
        required: false
        default: 'false'

jobs:
  generate:
    # Must be self-hosted: Anthropic's org IP allowlist rejects
    # GitHub-hosted runner IPs ("403 Your IP address isn't in this
    # organization's allowed range"), while this runner's corporate
    # egress IP is allowlisted. api.anthropic.com is only reachable
    # from here through the proxy below, so those env vars are required.
    # generate-briefing.js runs the Claude CLI engine (the former Google
    # Gemini engine was removed after its project hit its billing cap).
    runs-on: self-hosted
    # Opus at high effort can take 15-25 min; the script gives up at 45 so it
    # can still report the failure to the app before Actions kills the job.
    timeout-minutes: 50
    env:
      https_proxy: http://90.8.10.30:9090
      http_proxy: http://90.8.10.30:9090
      NODE_EXTRA_CA_CERTS: /home/sunjohwang/corp-ca-bundle.pem
      SSL_CERT_FILE: /home/sunjohwang/corp-ca-bundle.pem
      npm_config_cafile: /home/sunjohwang/corp-ca-bundle.pem
      GIT_SSL_CAINFO: /home/sunjohwang/corp-ca-bundle.pem
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install --omit=dev

      # npm installs into ~/.npm-global, which isn't on the runner's PATH, so
      # this step used to be a no-op: every run executed an older root-owned
      # copy in /usr/local/bin (2.1.251, installed 2026-08-31). By November the
      # API refused models to that version ("claude_code_version_too_old"),
      # which is what broke the scheduled runs. Put the fresh install first.
      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

      - name: Show Claude Code CLI in use
        run: |
          command -v claude
          claude --version

      - name: Generate briefing
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          SET_GITHUB_TOKEN: ${{ github.event.inputs.set_github_token }}
          SKIP_EMAIL: ${{ github.event.inputs.skip_email || 'false' }}
        run: node scripts/generate-briefing.js
